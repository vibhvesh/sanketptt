<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1e18"><title>Sanket PTT & Transcribe Demo</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#211914;color:#f8eadc;font:14px/1.35 Inter,system-ui,Arial,sans-serif;display:flex;flex-direction:column}
header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(90deg,#39271d,#182c38);border-bottom:1px solid #76523a}
.brand{font-weight:900;letter-spacing:1px;font-size:15px}.brand b{color:#ffb16c}.sub{font-size:9px;color:#c9ab91;letter-spacing:1.5px;margin-left:8px}.home{color:#f1c49e;text-decoration:none;font-size:11px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,3fr) minmax(0,7fr);gap:7px;padding:7px}
.panel{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid #74533c;border-radius:11px;background:#171e24;box-shadow:0 8px 25px #0005}

.ph small{font-size:9px;color:#e4c1a2;font-weight:500;letter-spacing:0}
.panel iframe{display:block;width:100%;height:calc(100% - 37px);min-height:0;flex:1;border:0;background:#07192d}
@media(max-width:560px){header{height:42px;flex-basis:42px;padding:0 8px}.brand{font-size:12px}.sub{display:none}.home{font-size:9px}main{gap:4px;padding:4px}.panel{border-radius:7px}.ph{height:34px;flex-basis:34px;padding:0 5px;font-size:9px;letter-spacing:.2px}.ph small{font-size:7px}.panel iframe{height:calc(100% - 34px)}}
