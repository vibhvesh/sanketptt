name: Deploy website to Hostinger

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "aakashvani/**"
      - ".github/workflows/deploy-hostinger.yml"
  workflow_dispatch:

concurrency:
  group: hostinger-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Stage site (website at root + aakashvani/)
        run: |
          mkdir -p _site/aakashvani
          rsync -a website/ _site/
          rsync -a aakashvani/ _site/aakashvani/
          ls -la _site/index.html _site/aakashvani/index.html

      - name: Rsync to VPS
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          # protect /preview — only the dev-branch workflow may write there.
          # Excluded paths are also kept from --delete (do not pass --delete-excluded).
          rsync -avzr --delete \
            --filter='P /preview/***' \
            --filter='P /preview' \
            --exclude '/preview/' \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new" \
            _site/ \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH%/}/"