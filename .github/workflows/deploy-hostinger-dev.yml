name: Deploy dev preview to Hostinger

# Publishes the dev branch to https://sanketptt.com/preview/ only.
# Destination is always ${DEPLOY_PATH}/preview — never the production root.
# Production rsync excludes this directory so --delete cannot remove it.

on:
  push:
    branches: [dev]
    paths:
      - "website/**"
      - ".github/workflows/deploy-hostinger-dev.yml"
  workflow_dispatch:

concurrency:
  group: hostinger-website-dev
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject GitHub-hosted site links
        run: bash scripts/check-links.sh

      - name: Verify SSH secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY DEPLOY_PATH; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Stage preview, rebase links under /preview/, noindex
        run: |
          mkdir -p _site
          rsync -a website/ _site/
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt
          python3 - << 'PY'
          import re
          from pathlib import Path

          PREFIX = "/preview"
          ROOTS = (
              "radio/", "transcribe/", "dmr/", "aakashvani/", "docs/", "pi/",
              "pi-webclient/", "superptt/", "dev/", "boondock/", "ptt/",
              "newlook/", "vani-admin/", "try/",
              "releases/", "css/", "js/", "demo.html", "radio-hub.html",
              "sanket-mark.svg",
          )
          attr = re.compile(
              r'(?P<prefix>\b(?:href|src|action)\s*=\s*["\'])/(?P<path>(?:' +
              "|".join(re.escape(r) for r in ROOTS) +
              r'|\?ch=))',
              re.I,
          )
          js = re.compile(
              r'(?P<q>["\'])/(?P<path>(?:' +
              "|".join(re.escape(r) for r in ROOTS) +
              r'|\?ch=))'
          )

          def shift(text):
              text = text.replace('location.origin+"/"', 'location.origin+"/preview/"')
              text = text.replace("location.origin+'/'", "location.origin+'/preview/'")
              text = text.replace("https://sanketptt.com/", "/preview/")
              # Origin with no path stays unslashed so BASE + "/radio/" becomes /preview/radio/.
              text = text.replace('https://sanketptt.com"', '/preview"')
              text = text.replace("https://sanketptt.com'", "/preview'")
              text = attr.sub(lambda m: m.group("prefix") + PREFIX + "/" + m.group("path"), text)
              text = js.sub(lambda m: m.group("q") + PREFIX + "/" + m.group("path"), text)
              text = text.replace('href="/"', 'href="/preview/"')
              text = text.replace("href='/'", "href='/preview/'")
              text = text.replace("/preview/preview/", "/preview/")
              return text

          meta = '<meta name="robots" content="noindex, nofollow">'
          n = 0
          for path in Path("_site").rglob("*"):
              if path.suffix.lower() not in {".html", ".js", ".css", ".md"}:
                  continue
              text = path.read_text(encoding="utf-8", errors="replace")
              updated = shift(text)
              if path.suffix.lower() == ".html" and 'name="robots"' not in updated and "name='robots'" not in updated:
                  lower = updated.lower()
                  idx = lower.find("<head")
                  if idx >= 0:
                      end = updated.find(">", idx)
                      if end >= 0:
                          updated = updated[:end + 1] + "\n" + meta + updated[end + 1:]
              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  n += 1
          print(f"rewrote {n} files for /preview/")
          home = Path("_site/index.html").read_text(encoding="utf-8")
          assert 'noindex' in home
          assert 'src="radio/' in home or "src=\"/preview/radio/" in home or "radio/" in home
          PY
          grep -q 'noindex' _site/index.html
          grep -q 'Disallow: /' _site/robots.txt

      - name: Rsync into /preview only
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${SSH_PORT:-22}"
          prod="${DEPLOY_PATH%/}"
          dest="${prod}/preview"
          if [ -z "$prod" ] || [ "$prod" = "/" ]; then
            echo "::error::DEPLOY_PATH is empty or /"
            exit 1
          fi
          case "$prod" in
            *".."*) echo "::error::DEPLOY_PATH must not contain .."; exit 1 ;;
          esac
          if [ "$dest" = "$prod" ] || [ "$dest" = "/" ]; then
            echo "::error::Refusing to deploy outside /preview"
            exit 1
          fi
          case "$dest" in
            "$prod"/preview) ;;
            *) echo "::error::Destination is not the preview folder"; exit 1 ;;
          esac
          echo "Deploying only to ${dest}/"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/deploy_key -p "$PORT" -o StrictHostKeyChecking=accept-new \
            "${SSH_USER}@${SSH_HOST}" "mkdir -p -- $(printf '%q' "$dest")"
          rsync -avzr --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=accept-new" \
            _site/ \
            "${SSH_USER}@${SSH_HOST}:${dest}/"
