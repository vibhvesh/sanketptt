name: Deploy Pages
on:
  push: {branches: [main]}
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily news and music radio directory crawl"]
    types: [completed]
    branches: [main]
permissions: {contents: read, pages: write, id-token: write}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: {name: github-pages, url: "${{ steps.d.outputs.page_url }}"}
    steps:
      - uses: actions/checkout@v4
      - name: Stage site (exclude top-level android/, APKs, build output)
        run: |
          mkdir _site
          rsync -a --exclude='.git*' --exclude='_site' --exclude='/android' --exclude='*.apk' --exclude='node_modules' --exclude='build' ./ _site/
          touch _site/.nojekyll
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
      - id: d
        uses: actions/deploy-pages@v4
