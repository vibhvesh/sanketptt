name: Build Prisha Shopper Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "website/sanket-game/**"
      - "android/prisha/**"
      - ".github/workflows/build-prisha-apk.yml"
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android build tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Create one-time APK signing key
        run: |
          mkdir -p "$RUNNER_TEMP/prisha-signing"
          echo "KEYSTORE_PASS=$(openssl rand -hex 20)" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=prisha" >> "$GITHUB_ENV"
      - name: Generate signing keystore
        run: |
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/prisha-signing/prisha.keystore" -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Prisha Shopper, OU=Canberra Vision AI Systems, O=Canberra Vision AI Systems, C=IN"
          echo "KEYSTORE=$RUNNER_TEMP/prisha-signing/prisha.keystore" >> "$GITHUB_ENV"
      - name: Build and verify APK
        run: |
          chmod +x android/prisha/build.sh
          mkdir -p dist
          android/prisha/build.sh "$GITHUB_WORKSPACE/dist/Prisha_Shopper.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Prisha-Shopper-Android-APK
          path: dist/Prisha_Shopper.apk
          if-no-files-found: error
          retention-days: 30