name: Refresh radio directory
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-directory-refresh
  cancel-in-progress: true
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Probe station endpoints and rebuild directory
        run: python scripts/refresh_radio_directory.py
      - name: Commit directory when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/data/radio-directory.json
          git diff --cached --quiet || git commit -m "Refresh verified radio station directory"
          git push
