name: Sanket Core CI

on:
  push:
    branches: [sanket-core-v1]
    paths:
      - "sanket-broadcast/**"
      - ".github/workflows/sanket-core.yml"
  pull_request:
    paths:
      - "sanket-broadcast/**"
      - ".github/workflows/sanket-core.yml"

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core test dependency
        run: python -m pip install --upgrade pip
      - name: Compile Broadcast modules
        run: python -m compileall -q sanket-broadcast/pi
      - name: Run relay safety tests
        working-directory: sanket-broadcast/pi
        run: python -m unittest discover -s tests -v
