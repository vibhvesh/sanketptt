<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2b1e18"><title>Sanket PTT & Transcribe Demo</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#211914;color:#f8eadc;font:14px/1.35 Inter,system-ui,Arial,sans-serif;display:flex;flex-direction:column}
header{height:48px;flex:0 0 48px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:linear-gradient(90deg,#39271d,#182c38);border-bottom:1px solid #76523a}
.brand{font-weight:900;letter-spacing:1px;font-size:15px}.brand b{color:#ffb16c}.sub{font-size:9px;color:#c9ab91;letter-spacing:1.5px;margin-left:8px}.head-actions{display:flex;align-items:center;gap:10px}.home{color:#f1c49e;text-decoration:none;font-size:11px}.invite{border:1px solid #d99a62;background:#a65d2e;color:#fff5e9;border-radius:7px;padding:7px 11px;font-weight:800;font-size:10px;cursor:pointer}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;padding:7px}
.panel{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid #74533c;border-radius:11px;background:#171e24;box-shadow:0 8px 25px #0005}
.ph{height:37px;flex:0 0 37px;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:0 10px;background:linear-gradient(90deg,#563522,#19384a);font-weight:900;font-size:11px;letter-spacing:.8px}
.ph small{font-size:9px;color:#e4c1a2;font-weight:500;letter-spacing:0}
.panel iframe{display:block;width:100%;height:calc(100% - 37px);min-height:0;flex:1;border:0;background:#07192d}
@media(max-width:560px){header{height:42px;flex-basis:42px;padding:0 8px}.invite{padding:6px 7px;font-size:8px}.head-actions{gap:6px}.brand{font-size:12px}.sub{display:none}.home{font-size:9px}main{gap:4px;padding:4px}.panel{border-radius:7px}.ph{height:34px;flex-basis:34px;padding:0 5px;font-size:9px;letter-spacing:.2px}.ph small{font-size:7px}.panel iframe{height:calc(100% - 34px)}}

/* Demo split: give PTT and transcription equal space on phones and desktops */
main{grid-template-columns:repeat(2,minmax(0,1fr))!important}
.panel{width:100%!important;min-width:0!important}
.panel iframe{width:100%!important;max-width:100%!important}
@media(max-width:560px){main{grid-template-columns:repeat(2,minmax(0,1fr))!important}}

/* Stable equal-size demo panels: both frames occupy the same full-height grid cell */
html,body{width:100%;height:100%;min-height:0!important}
body{overflow:hidden!important}
main{display:grid!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;grid-template-rows:minmax(0,1fr)!important;align-items:stretch!important;height:auto!important;flex:1 1 0!important;min-height:0!important}
.panel{display:flex!important;flex-direction:column!important;width:100%!important;height:100%!important;min-width:0!important;min-height:0!important;max-height:none!important;align-self:stretch!important}
.panel iframe{display:block!important;flex:1 1 0!important;width:100%!important;height:0!important;min-width:0!important;min-height:0!important}
@media(max-width:560px){
 main{height:auto!important;flex:1 1 0!important;grid-template-columns:minmax(0,1fr) minmax(0,1fr)!important;gap:4px!important;padding:4px!important}
 .panel .ph{height:34px!important;flex-basis:34px!important;min-width:0!important}
 .panel .ph span{font-size:8px!important;line-height:1.15!important}
 .panel .ph small{font-size:6px!important}
}
</style><style id="sanket-newlook-demo">
:root{color-scheme:light;--ink:#12243a;--muted:#63758a;--line:#e2eaf1;--orange:#f47721;--navy:#091c32;--cyan:#20bfc0}
*{box-sizing:border-box}html,body{width:100%;height:100%;min-height:0;margin:0}body{background:#f3f7fa;color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,sans-serif}
header{height:60px;flex:0 0 60px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(12px,3vw,28px);background:rgba(255,255,255,.92);border-bottom:1px solid var(--line);box-shadow:0 4px 20px #102a4309;backdrop-filter:blur(16px)}
.brand{font-size:17px;letter-spacing:.5px;color:#102840}.brand b{color:var(--orange)}.sub{font-size:9px;color:#7a8b9c;letter-spacing:1.3px}
.head-actions{display:flex;align-items:center;gap:10px}.home{color:#52677c;text-decoration:none;font-size:11px;font-weight:700}.home:hover{color:var(--orange)}
.invite{border:0;background:linear-gradient(135deg,#ff8b3d,#ed681a);color:white;border-radius:10px;padding:10px 14px;font-weight:850;font-size:10px;cursor:pointer;box-shadow:0 6px 18px #f4772129}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:12px}
.panel{min-width:0;min-height:0;height:100%;display:flex;flex-direction:column;overflow:hidden;border:1px solid #dfe8ef;border-radius:16px;background:#fff;box-shadow:0 12px 34px #102a4310}
.ph{height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:0 14px;background:linear-gradient(90deg,#102b45,#16445a);color:#f2f8fc;font-weight:900;font-size:11px;letter-spacing:.6px}
.ph small{font-size:9px;color:#b4d8df;font-weight:600;letter-spacing:0}
.panel iframe{display:block;width:100%;height:calc(100% - 42px);min-height:0;flex:1;border:0;background:#07192d}
@media(max-width:560px){header{height:50px;flex-basis:50px;padding:0 8px}.invite{padding:8px 9px;font-size:8px}.head-actions{gap:7px}.brand{font-size:13px}.sub{display:none}.home{font-size:9px}main{gap:5px;padding:5px}.panel{border-radius:9px}.ph{height:36px;flex-basis:36px;padding:0 6px;font-size:8px;letter-spacing:.1px}.ph small{font-size:6px}.panel iframe{height:calc(100% - 36px)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head><body>
<header><div class="brand">SANKET <b>PTT</b><span class="sub">LIVE RADIO CONSOLE</span></div><div class="head-actions"><button class="invite" id="inviteBtn" type="button">↗ INVITE / SHARE</button><a class="home" href="./">← Sanket Home</a></div></header>
<main>
<section class="panel"><div class="ph"><span>01 · SANKET PTT DEMO</span><small>JOIN · TALK · SSTV</small></div><iframe title="Sanket PTT Demo" src="https://sanketptt.com/?ch=sanket-website-demo&amp;embed=1" allow="microphone; autoplay" loading="eager"></iframe></section>
<section class="panel"><div class="ph"><span>02 · SANKET TRANSCRIBE DEMO</span><small>ENGLISH → HINDI · AUTO POWER</small></div><iframe title="Sanket Transcribe Demo" src="https://sanketptt.com/transcribe/?demo=1&amp;ch=sanket-website-demo&amp;autostart=1&amp;compact=1" allow="microphone; autoplay" loading="eager"></iframe></section>
</main>
<script>
(()=>{const q=new URLSearchParams(location.search),channel=(q.get('ch')||'sanket-website-demo').replace(/[^\\w-]/g,'').slice(0,40)||'sanket-website-demo';
 const p=document.querySelector('iframe[title="Sanket PTT Demo"]'),t=document.querySelector('iframe[title="Sanket Transcribe Demo"]');
 if(p)p.src='https://sanketptt.com/?ch='+encodeURIComponent(channel)+'&embed=1';
 if(t)t.src='https://sanketptt.com/transcribe/?demo=1&ch='+encodeURIComponent(channel)+'&autostart=1&compact=1';
 document.getElementById('inviteBtn').addEventListener('click',async()=>{const url=new URL(location.href);url.searchParams.set('ch',channel);const data={title:'Join my Sanket PTT channel',text:'Join me on Sanket PTT. Open this link to talk on the same channel:',url:url.href};
  try{if(navigator.share)await navigator.share(data);else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(url.href);alert('Invite link copied. Share it on WhatsApp, Facebook or anywhere.')}else prompt('Copy this invite link',url.href)}catch(e){if(e.name!=='AbortError')prompt('Copy this invite link',url.href)}
 });
})();
</script></body></html>
