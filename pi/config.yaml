# Sanket PTT - Raspberry Pi listen-only client configuration
channel: virtual              # same as ?ch=<channel> in the radio link
callsign: ""                  # empty -> SanketPi-<hostname>
broker_url: wss://public.cloud.shiftr.io   # user/pass public:public is used for shiftr.io
broker_username: public
broker_password: public
whisper_model: base           # tiny | base | small | medium (small is slow on a Pi 5)
whisper_compute_type: int8
language: auto                # auto | en | hi | ...
beam_size: 1
keywords: [mayday, emergency, fire, help, chetavani, "चेतावनी", alert]
volume: 1.0                   # 0.0 - 2.0 live playback gain
audio_device: null            # null = ALSA default; or name/index from `python3 -m sounddevice`
tts: true                     # speak keyword alerts
tts_engine: espeak-ng         # espeak-ng | piper
piper_model: ""               # path to a piper .onnx voice if tts_engine: piper
beep: true
clips_dir: ~/sanket_clips
retention_days: 7
log_file: ~/sanket_clips/sanket_pi.log
