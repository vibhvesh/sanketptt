<!doctype html><html lang=en><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SuperPTT</title><link rel=manifest href=manifest.json><meta name=theme-color content="#0b1015"><link rel=icon href=icon.svg>
<meta name=apple-mobile-web-app-capable content=yes>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1015;color:#d6f0ff;font:15px system-ui;-webkit-user-select:none;user-select:none}
header{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#111b24;position:sticky;top:0;z-index:2}
header b{font-family:monospace;letter-spacing:2px}#net{margin-left:auto;font-size:12px;color:#789}
.wrap{padding:10px;max-width:720px;margin:auto}.card{background:#121c26;border-radius:10px;padding:10px;margin-bottom:10px}
.ch{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px;border-radius:8px;margin-bottom:6px;background:#162330;border:2px solid transparent}
.ch.tx{border-color:#2ecc71}.ch.busy{background:#3a1d1d}.ch.mine{background:#123a24}.ch .nm{font-weight:600}.ch .who{font-size:12px;color:#9ab}
.ch .who .t{color:#ff6b6b;font-weight:700}.ch .who .ov{color:#ffcc00}.ch input[type=range]{width:80px}
button,input,select{background:#1d2d3c;color:#d6f0ff;border:1px solid #345;border-radius:6px;padding:6px 10px;font:inherit}
.sel{width:22px;height:22px}.pill{font-size:11px;padding:2px 6px;border-radius:8px;background:#345}.cut{background:#c0392b}
#ptt{width:100%;height:120px;border-radius:60px;font-size:22px;font-weight:800;letter-spacing:2px;background:#1e5631;border:3px solid #2ecc71;color:#fff;touch-action:none}
#ptt.on{background:#a81d1d;border-color:#ff6b6b}#ptt.busy{background:#f0a500;border-color:#ffd166;color:#1a1200}#ptt.off{background:#3a3f44;border-color:#5a6066;color:#b8c0c8}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.m{font-size:12px;color:#789}#log li{font-size:13px;margin:3px 0}.lock{color:#2ecc71;font-size:12px}.open{color:#f93;font-size:12px}.nokey{color:#f66;font-size:12px}
.hide{display:none}label{font-size:13px}
</style>
<header><b>SUPER·PTT</b><span id=me class=pill></span><span id=net>offline</span><button id=gear>⚙</button></header>
<div class=wrap>
<div class="card hide" id=setup>
 <div class=row><label>Name / call sign <input id=name maxlength=40></label></div>
 <p class=m>Connect to a control room (admin URL + directory token) to load all channels, or type channels manually.</p>
 <div class=row><input id=admin placeholder="https://control-room URL" style=flex:1><input id=dtok placeholder="directory token" style=width:150px></div>
 <div class=row style=margin-top:6px><input id=manual placeholder="manual channels: virtual, master" style=flex:1><label><input type=checkbox id=disc> discover active channels</label></div>
 <details style=margin-top:6px><summary class=m>Broker (default: public brokers)</summary>
 <div class=row style=margin-top:4px><input id=burl placeholder="wss://your-private-broker (empty = public)" style=flex:1></div>
 <div class=row style=margin-top:4px><input id=buser placeholder="username" style=width:120px autocomplete=username><input id=bpass type=password placeholder="password" style=width:120px autocomplete=current-password></div></details>
 <p class=m id=keyinfo></p>
 <div class=row style=margin-top:6px><button id=go>Connect</button><span id=serr class=m></span></div>
</div>
<div class=card><div class=row style="justify-content:space-between"><b>Channels</b>
 <span class=row><button id=allsel class=m>all</button><button id=nonesel class=m>none</button><input id=add placeholder="+ channel" style=width:110px></span></div>
 <p class=m style=margin:4px>Tap a channel = transmit there · ☐ = include in ALL-CALL · 🔇/slider = listen volume</p>
 <div id=chs></div></div>
<div class=card>
 <div class=row style="justify-content:space-between;margin-bottom:8px"><span>TX → <b id=txname>–</b></span>
 <label><input type=checkbox id=allcall> ALL-CALL (checked channels)</label></div>
 <button id=ptt>PUSH TO TALK</button><div id=pst class=m style="text-align:center;margin-top:6px"></div></div>
<div class=card><b>Activity</b><ul id=log class=m></ul></div>
</div>
<script src="https://unpkg.com/mqtt@5/dist/mqtt.min.js"></script>
<script src="superptt.js"></script><script src="app.js"></script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){})</script>
</html>
